name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Build examples
        run: cargo build --examples
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  no_std:
    name: no_std build (thumbv7em-none-eabihf / ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # A target without std proves the core needs only `alloc`; the host
      # `--no-default-features` test above cannot show that.
      - name: Build the library for a target without std
        run: cargo build --lib --no-default-features --target thumbv7em-none-eabihf

  fuzz:
    name: Fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    env:
      # The harness builds on nightly; a lint that nightly adds later must
      # not turn the smoke run red, so the workflow-wide `-D warnings` is
      # dropped here (cargo-fuzz adds its own instrumentation flags).
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        target:
          [server_conn, client_conn, chunk_line, reference_diff, httparse_diff, builders]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      # Not in install-action's manifest list; it falls back to
      # cargo-binstall, which fetches the published binary. That binary is a
      # musl build and would default to building for musl, which the address
      # sanitizer cannot use, so every cargo-fuzz call names the gnu target.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build the target
        working-directory: fuzz
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu ${{ matrix.target }}
      # The corpus lives outside the repository (in the runner's temp
      # directory), so a run never writes into the checkout.
      - name: Run for 60 seconds
        working-directory: fuzz
        run: |
          mkdir -p "$RUNNER_TEMP/corpus/${{ matrix.target }}" "$RUNNER_TEMP/artifacts/${{ matrix.target }}"
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} "$RUNNER_TEMP/corpus/${{ matrix.target }}" -- \
            -max_total_time=60 -dict=http.dict \
            -artifact_prefix="$RUNNER_TEMP/artifacts/${{ matrix.target }}/"
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts/${{ matrix.target }}/

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
